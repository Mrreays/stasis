# Base : l'appli seule, isolée, joignable uniquement depuis le serveur (127.0.0.1:8010).
# C'est la configuration à utiliser sur un serveur qui a déjà son propre reverse proxy.
# Pour un serveur dédié avec HTTPS automatique, ajouter docker-compose.caddy.yml (voir README).
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8000"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?définir APP_PASSWORD dans .env}
      APP_TZ: Europe/Paris
    volumes:
      - stasis_data:/srv/data      # base SQLite (ta progression)
      - ./content:/srv/content:ro  # leçons : un simple « git pull » suffit à les mettre à jour
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [stasis_net]

volumes:
  stasis_data:

networks:
  stasis_net:
